name: Materialize Brand OS v1.0

on:
  push:
    branches:
      - brand-os/v0.1-foundation
    paths:
      - bundle/READY

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild package archive
        shell: bash
        run: |
          set -euo pipefail
          cat bundle/v1.part*.b64 | tr -dc 'A-Za-z0-9+/=' > /tmp/v1.b64
          base64 --decode /tmp/v1.b64 > /tmp/v1.tar.gz
          gzip -t /tmp/v1.tar.gz

      - name: Materialize Brand OS
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/v1.tar.gz -C .
          rm -rf bundle
          rm -f .github/workflows/materialize-brand-os.yml

      - name: Commit Brand OS v1.0
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Materialize complete Brand OS v1.0 with current CU logo"
          git push origin HEAD:brand-os/v0.1-foundation
