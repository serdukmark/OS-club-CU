name: Materialize Brand OS v1.0

on:
  push:
    branches:
      - brand-os/v0.1-foundation
    paths:
      - bundle/READY

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild package archive
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, glob, re
          s=''.join(open(f,encoding='utf-8').read() for f in sorted(glob.glob('bundle/v1.part*.b64')))
          s=re.sub(r'[^A-Za-z0-9+/=]','',s).replace('=','')
          s += '=' * ((4-len(s)%4)%4)
          data=base64.b64decode(s, validate=False)
          open('/tmp/v1.tar.gz','wb').write(data)
          PY
          gzip -t /tmp/v1.tar.gz

      - name: Materialize Brand OS
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/v1.tar.gz -C .
          rm -rf bundle
          rm -f .github/workflows/materialize-brand-os.yml

      - name: Commit Brand OS v1.0
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Materialize complete Brand OS v1.0 with current CU logo"
          git push origin HEAD:brand-os/v0.1-foundation
